<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BelajarAja! 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sky:#4FC3F7;--sun:#FFD54F;--grass:#81C784;--coral:#FF8A65;--purple:#CE93D8;--card:#FFFDE7;--ink:#37474F;--radius:20px;--shadow:0 6px 0 rgba(0,0,0,0.12);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#E3F2FD 0%,#F3E5F5 50%,#E8F5E9 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.screen{display:none;width:100%;max-width:500px;}
.screen.active{display:block;}
.card{background:white;border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow),0 2px 32px rgba(0,0,0,0.08);position:relative;overflow:hidden;}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--sky),var(--purple),var(--coral),var(--sun));}
.title{font-size:2rem;font-weight:900;color:var(--ink);text-align:center;line-height:1.1;}
.title span{color:var(--coral);}
.subtitle{font-size:0.95rem;color:#78909C;text-align:center;margin-top:8px;}
.label{font-size:0.8rem;font-weight:700;color:#90A4AE;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.input{width:100%;padding:14px 18px;font-size:1.1rem;font-family:'Nunito',sans-serif;font-weight:700;border:3px solid #E0E0E0;border-radius:14px;outline:none;transition:border-color .2s;color:var(--ink);}
.input:focus{border-color:var(--sky);}
.avatars{display:flex;gap:12px;justify-content:center;margin:16px 0;}
.av{width:58px;height:58px;font-size:1.9rem;border-radius:50%;border:4px solid #E0E0E0;background:#F5F5F5;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
.av.selected{border-color:var(--coral);background:#FFF3E0;transform:scale(1.15);}
.btn{display:block;width:100%;padding:14px;font-size:1rem;font-family:'Nunito',sans-serif;font-weight:800;border:none;border-radius:14px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow);margin-top:12px;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,0.12);}
.btn-primary{background:var(--coral);color:white;}
.btn-sky{background:var(--sky);color:white;}
.btn-ghost{background:#F5F5F5;color:#78909C;box-shadow:none;border:2px solid #E0E0E0;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.player-badge{display:flex;align-items:center;gap:8px;background:#F5F5F5;border-radius:50px;padding:5px 12px 5px 8px;}
.player-av{font-size:1.4rem;}
.player-name{font-weight:800;font-size:0.88rem;color:var(--ink);}
.stars-badge{display:flex;align-items:center;gap:4px;background:var(--sun);border-radius:50px;padding:5px 12px;font-weight:800;font-size:0.9rem;color:#5D4037;}
/* Topic grid */
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.topic-card{border-radius:16px;padding:14px 10px;cursor:pointer;border:3px solid transparent;text-align:center;transition:all .2s;position:relative;overflow:hidden;}
.topic-card:hover:not(.locked){transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.12);}
.topic-card.locked{opacity:0.5;cursor:not-allowed;}
.topic-icon{font-size:2rem;display:block;margin-bottom:5px;}
.topic-name{font-size:0.82rem;font-weight:800;color:var(--ink);display:block;line-height:1.2;}
.topic-bar-wrap{border-radius:50px;height:5px;margin-top:7px;}
.topic-bar{height:100%;border-radius:50px;transition:width .4s;}
.topic-prog{font-size:0.72rem;font-weight:700;margin-top:4px;}
.badge-corner{position:absolute;top:7px;right:7px;font-size:0.95rem;}
/* Progress */
.progress-wrap{background:#F5F5F5;border-radius:50px;height:10px;margin-bottom:3px;overflow:hidden;}
.progress-bar{height:100%;border-radius:50px;background:linear-gradient(90deg,var(--sky),var(--purple));transition:width .6s cubic-bezier(.34,1.56,.64,1);}
.progress-label{font-size:0.72rem;font-weight:700;color:#90A4AE;text-align:right;}
.kc-badge{display:inline-block;background:#F3E5F5;color:#7B1FA2;border-radius:50px;padding:3px 12px;font-size:0.76rem;font-weight:800;margin-bottom:10px;}
.question-box{background:var(--card);border-radius:var(--radius);padding:18px;text-align:center;font-size:1.1rem;font-weight:700;color:var(--ink);margin-bottom:16px;border:3px solid #FFF9C4;min-height:80px;display:flex;align-items:center;justify-content:center;line-height:1.5;white-space:pre-line;}
/* ── PILGAN ── */
.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.option{padding:14px 8px;font-size:0.95rem;font-family:'Nunito',sans-serif;font-weight:800;border:3px solid #E0E0E0;border-radius:14px;background:white;cursor:pointer;text-align:center;transition:all .15s;color:var(--ink);box-shadow:0 4px 0 #E0E0E0;}
.option:hover:not(:disabled){border-color:var(--sky);background:#E3F2FD;transform:translateY(-2px);box-shadow:0 6px 0 #B3E5FC;}
.option.correct{border-color:var(--grass);background:#E8F5E9;box-shadow:0 4px 0 #A5D6A7;color:#2E7D32;animation:pop .3s ease;}
.option.wrong{border-color:var(--coral);background:#FBE9E7;box-shadow:0 4px 0 #FFCCBC;color:#BF360C;}
.option:disabled{cursor:default;}
/* ── ISIAN ── */
.isian-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:4px;}
.isian-input{width:140px;padding:16px;font-size:2.2rem;font-family:'Nunito',sans-serif;font-weight:900;border:4px solid #E0E0E0;border-radius:18px;outline:none;text-align:center;color:var(--ink);transition:border-color .2s;-moz-appearance:textfield;appearance:textfield;}
.isian-input::-webkit-outer-spin-button,.isian-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.isian-input:focus{border-color:var(--sky);}
.isian-input.correct{border-color:var(--grass);background:#E8F5E9;}
.isian-input.wrong{border-color:var(--coral);background:#FBE9E7;}
.isian-hint{font-size:0.8rem;color:#90A4AE;font-weight:600;}
.isian-submit{padding:14px 32px;font-size:1.05rem;font-family:'Nunito',sans-serif;font-weight:800;background:var(--coral);color:white;border:none;border-radius:14px;cursor:pointer;box-shadow:0 5px 0 #E64A19;transition:all .15s;}
.isian-submit:active{transform:translateY(4px);box-shadow:0 2px 0 #E64A19;}
.isian-submit:disabled{background:#B0BEC5;box-shadow:0 5px 0 #90A4AE;cursor:default;}
/* ── HITUNG ── */
.hitung-canvas{background:linear-gradient(135deg,#E8F5E9,#F3E5F5);border-radius:18px;padding:20px;min-height:180px;position:relative;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;justify-content:center;border:3px solid #C8E6C9;margin-bottom:12px;}
.hitung-obj{font-size:2.2rem;cursor:pointer;transition:all .2s;border-radius:50%;padding:6px;border:3px solid transparent;user-select:none;position:relative;}
.hitung-obj:hover:not(.done){transform:scale(1.15);}
.hitung-obj.clicked{border-color:#1976D2;background:rgba(33,150,243,0.15);animation:pop .2s ease;}
.hitung-obj.done{cursor:default;}
.hitung-counter{position:absolute;top:-8px;right:-8px;background:#1976D2;color:white;border-radius:50%;width:22px;height:22px;font-size:0.65rem;font-weight:900;display:flex;align-items:center;justify-content:center;}
.hitung-scoreboard{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;}
.hitung-count-display{background:white;border-radius:50px;padding:8px 20px;font-size:1.5rem;font-weight:900;color:#1976D2;border:3px solid #BBDEFB;box-shadow:0 3px 0 #BBDEFB;}
.hitung-submit{padding:12px 28px;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;background:var(--grass);color:white;border:none;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 #4CAF50;transition:all .15s;}
.hitung-submit:disabled{background:#B0BEC5;box-shadow:0 4px 0 #90A4AE;cursor:default;}
.hitung-hint{font-size:0.78rem;color:#78909C;font-weight:600;text-align:center;margin-bottom:8px;}
/* ── VISUAL PILGAN ── */
.visual-display{background:linear-gradient(135deg,#E3F2FD,#FFF9C4);border-radius:18px;padding:18px;text-align:center;margin-bottom:14px;border:3px solid #BBDEFB;font-size:2rem;line-height:1.6;min-height:80px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;}
/* ── Feedback ── */
.feedback{border-radius:14px;padding:12px 16px;text-align:center;font-weight:800;font-size:0.95rem;margin-top:14px;display:none;}
.feedback.show{display:block;animation:slideUp .3s ease;}
.feedback.good{background:#E8F5E9;color:#2E7D32;}
.feedback.bad{background:#FBE9E7;color:#BF360C;}
.feedback .emoji{font-size:1.6rem;display:block;margin-bottom:3px;}
#btn-next{display:none;margin-top:12px;}
.btn-back{background:none;border:none;cursor:pointer;font-size:1.2rem;padding:4px 8px;border-radius:8px;color:#90A4AE;font-family:'Nunito',sans-serif;font-weight:700;}
.btn-back:hover{background:#F5F5F5;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:white;border-radius:50px;padding:10px 22px;font-weight:800;font-size:0.9rem;box-shadow:0 8px 32px rgba(0,0,0,0.15);border:3px solid var(--sun);transition:transform .4s cubic-bezier(.34,1.56,.64,1);z-index:999;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.done-emoji{font-size:4rem;text-align:center;display:block;margin-bottom:10px;}
.deco{position:fixed;font-size:2.5rem;opacity:0.1;pointer-events:none;user-select:none;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes starPop{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.3) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.star-anim{display:inline-block;animation:starPop .5s ease forwards;}
</style>
</head>
<body>
<span class="deco" style="top:5%;left:3%">⭐</span>
<span class="deco" style="top:10%;right:4%">🌙</span>
<span class="deco" style="bottom:8%;left:5%">🌈</span>
<span class="deco" style="bottom:10%;right:3%">✨</span>
<div class="toast" id="toast"></div>

<!-- REGISTER -->
<div class="screen active" id="screen-register">
  <div class="card">
    <div class="title">Halo! 👋<br><span>Siapa namamu?</span></div>
    <div class="subtitle">Yuk belajar Matematika bersama!</div>
    <div style="margin-top:20px;"><div class="label">Nama kamu</div>
      <input class="input" id="inp-name" type="text" placeholder="Tulis namamu..." maxlength="20" autocomplete="off">
    </div>
    <div style="margin-top:16px;"><div class="label">Pilih karakter</div>
      <div class="avatars" id="avatar-picker">
        <div class="av selected" data-av="1">🦊</div>
        <div class="av" data-av="2">🐧</div>
        <div class="av" data-av="3">🦄</div>
        <div class="av" data-av="4">🐸</div>
        <div class="av" data-av="5">🐼</div>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-start">Mulai Belajar! 🚀</button>
  </div>
</div>

<!-- TOPICS -->
<div class="screen" id="screen-topics">
  <div class="card">
    <div class="topbar">
      <div class="player-badge"><span class="player-av" id="t-av">🦊</span><span class="player-name" id="t-name">-</span></div>
      <div class="stars-badge">⭐ <span id="t-stars">0</span></div>
    </div>
    <div style="font-size:1.05rem;font-weight:800;color:var(--ink);margin-bottom:2px;">Pilih Topik 📚</div>
    <div class="subtitle" style="text-align:left;font-size:0.85rem;">Mau belajar apa hari ini?</div>
    <div class="topic-grid" id="topic-grid"></div>
    <button class="btn btn-ghost" id="btn-random" style="margin-top:12px;font-size:0.9rem;">🎲 Pilihkan untukku!</button>
  </div>
</div>

<!-- QUESTION -->
<div class="screen" id="screen-question">
  <div class="card">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:5px;">
        <button class="btn-back" id="btn-back">←</button>
        <div class="player-badge"><span class="player-av" id="q-av">🦊</span><span class="player-name" id="q-name">-</span></div>
      </div>
      <div class="stars-badge">⭐ <span id="q-stars">0</span></div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
    <div class="progress-label" id="prog-label">0 / 23 KC</div>
    <div style="margin-top:10px;margin-bottom:4px;"><span class="kc-badge" id="kc-name">...</span></div>
    <div class="question-box" id="question-text">Memuat soal... ⏳</div>
    <div id="question-body"></div>
    <div class="feedback" id="feedback"><span class="emoji" id="feedback-emoji"></span><span id="feedback-text"></span></div>
    <button class="btn btn-sky" id="btn-next">Soal Berikutnya ➡️</button>
  </div>
</div>

<!-- TOPIC DONE -->
<div class="screen" id="screen-topic-done">
  <div class="card" style="text-align:center;">
    <span class="done-emoji" id="td-emoji">🎉</span>
    <div class="title"><span id="td-title">Topik Selesai!</span></div>
    <p style="margin-top:10px;color:#78909C;font-size:0.9rem;font-weight:600;" id="td-msg"></p>
    <button class="btn btn-primary" id="btn-back-topics" style="margin-top:20px;">← Kembali ke Topik</button>
  </div>
</div>

<!-- ALL DONE -->
<div class="screen" id="screen-done">
  <div class="card" style="text-align:center;">
    <span class="done-emoji">🏆</span>
    <div class="title">Luar Biasa!<br><span>Kamu Hebat!</span></div>
    <p style="margin-top:10px;color:#78909C;font-size:0.9rem;font-weight:600;">Semua topik sudah selesai!</p>
    <div style="margin-top:16px;font-size:1.8rem;font-weight:900;color:#F57F17;">⭐ <span id="final-stars">0</span> bintang</div>
    <button class="btn btn-primary" id="btn-again" style="margin-top:20px;">Mulai Lagi 🔄</button>
  </div>
</div>

<script>
const AVATARS={1:"🦊",2:"🐧",3:"🦄",4:"🐸",5:"🐼"};
const TOPIC_META={
  bilangan:{icon:"🔢",bg:"#E3F2FD",ac:"#1976D2"},
  operasi:{icon:"➕",bg:"#E8F5E9",ac:"#388E3C"},
  geometri:{icon:"🔷",bg:"#FBE9E7",ac:"#E64A19"},
  pengukuran:{icon:"📏",bg:"#FFF8E1",ac:"#F57F17"},
  pola:{icon:"🔄",bg:"#F3E5F5",ac:"#7B1FA2"},
};
const CORRECT_MSG=[["Benar sekali! 🎉","Kamu hebat!"],["Luar biasa! ⭐","Terus semangat!"],["Betul! 🌟","Pintar!"],["Yay! 🥳","Jawaban tepat!"]];
const WRONG_MSG=[["Hampir benar! 💪","Coba lagi ya!"],["Belum tepat 🤔","Jangan menyerah!"],["Yuk coba lagi! 😊","Pasti bisa!"]];

let state={sid:null,name:"",avatar:1,topic:null,currentKC:null,currentAnswer:null,currentType:null,answered:false};

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById("screen-"+id).classList.add("active");}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2800);}

async function api(path,method="GET",body=null){
  const opts={method,headers:{"Content-Type":"application/json"}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(path,opts);
  if(!r.ok){let e;try{e=(await r.json()).error;}catch{e=r.statusText;}throw new Error(e||`HTTP ${r.status}`);}
  return r.json();
}

// Register
document.querySelectorAll(".av").forEach(el=>{
  el.addEventListener("click",()=>{
    document.querySelectorAll(".av").forEach(a=>a.classList.remove("selected"));
    el.classList.add("selected");
    state.avatar=parseInt(el.dataset.av);
  });
});
document.getElementById("btn-start").addEventListener("click",async()=>{
  const name=document.getElementById("inp-name").value.trim();
  if(!name){document.getElementById("inp-name").style.borderColor="var(--coral)";document.getElementById("inp-name").focus();return;}
  try{
    const res=await api("/api/register","POST",{name,avatar:state.avatar});
    state.sid=res.student_id;state.name=res.name;
    updatePlayerUI();show("topics");loadTopics();
  }catch(e){alert("Gagal daftar: "+e.message);}
});

// Topics
async function loadTopics(){
  try{
    const[topics,stu]=await Promise.all([api(`/api/topics/${state.sid}`),api(`/api/student/${state.sid}`)]);
    document.getElementById("t-stars").textContent=stu.total_stars||0;
    renderTopics(topics);
    if(topics.every(t=>t.completed)){document.getElementById("final-stars").textContent=stu.total_stars||0;show("done");}
  }catch(e){console.error(e);}
}
function renderTopics(topics){
  const grid=document.getElementById("topic-grid");
  grid.innerHTML="";
  topics.forEach(t=>{
    const m=TOPIC_META[t.id]||{icon:"📚",bg:"#F5F5F5",ac:"#607D8B"};
    const pct=t.n_total>0?Math.round(t.n_mastered/t.n_total*100):0;
    const card=document.createElement("div");
    card.className="topic-card"+(t.locked?" locked":"")+(t.completed?" completed":"");
    card.style.background=m.bg;
    card.style.borderColor=t.completed?"#81C784":t.locked?"#E0E0E0":m.ac+"55";
    card.innerHTML=`<span class="badge-corner">${t.locked?"🔒":t.completed?"✅":""}</span>
      <span class="topic-icon">${m.icon}</span>
      <span class="topic-name">${t.label}</span>
      <div class="topic-bar-wrap" style="background:rgba(0,0,0,0.1)">
        <div class="topic-bar" style="width:${pct}%;background:${m.ac}"></div>
      </div>
      <div class="topic-prog" style="color:${m.ac}">${t.n_mastered}/${t.n_total} selesai</div>`;
    if(!t.locked)card.addEventListener("click",()=>startTopic(t.id));
    else card.title="Selesaikan topik lain dulu!";
    grid.appendChild(card);
  });
}
async function startTopic(topicId){state.topic=topicId;show("question");await loadNextQuestion();}
document.getElementById("btn-random").addEventListener("click",async()=>{
  try{
    const topics=await api(`/api/topics/${state.sid}`);
    const avail=topics.filter(t=>!t.locked&&!t.completed);
    if(!avail.length){showToast("Semua topik selesai! 🎉");return;}
    startTopic(avail.sort((a,b)=>(a.n_mastered/a.n_total)-(b.n_mastered/b.n_total))[0].id);
  }catch(e){alert(e.message);}
});
document.getElementById("btn-back").addEventListener("click",()=>{state.topic=null;show("topics");loadTopics();});
document.getElementById("btn-back-topics").addEventListener("click",()=>{show("topics");loadTopics();});

// ── Question Flow ──────────────────────────────────────────────────────────
async function loadNextQuestion(){
  state.answered=false;
  document.getElementById("feedback").classList.remove("show");
  document.getElementById("btn-next").style.display="none";
  document.getElementById("question-text").textContent="Memuat soal... ⏳";
  document.getElementById("question-body").innerHTML="";
  document.getElementById("kc-name").textContent="...";
  try{
    const url=`/api/next-question/${state.sid}`+(state.topic?`?topic=${state.topic}`:"");
    const q=await api(url);
    if(q.done){
      document.getElementById("td-emoji").textContent=q.message&&q.message.includes("lain dulu")?"🔒":"🎉";
      document.getElementById("td-title").textContent=q.message&&q.message.includes("lain dulu")?"Topik Terkunci":"Topik Selesai!";
      document.getElementById("td-msg").textContent=q.message;
      show("topic-done");return;
    }
    state.currentKC=q.kc_id;
    state.currentAnswer=String(q.answer).trim().toLowerCase();
    state.currentType=q.type||"pilgan";
    document.getElementById("kc-name").textContent="📚 "+(q.kc_name||q.kc_id);
    document.getElementById("question-text").textContent=q.q;
    renderQuestionBody(q);
    const prog=await api(`/api/progress/${state.sid}`);
    if(prog&&!prog.error)updateProgress(prog);
  }catch(e){document.getElementById("question-text").textContent="Gagal memuat: "+e.message;}
}

function renderQuestionBody(q){
  const wrap=document.getElementById("question-body");
  wrap.innerHTML="";
  const type=q.type||"pilgan";

  if(type==="pilgan"){
    const grid=document.createElement("div");
    grid.className="options";
    (q.options||[]).forEach(opt=>{
      const btn=document.createElement("button");
      btn.className="option";btn.textContent=opt;btn.dataset.val=opt;
      btn.addEventListener("click",()=>submitAnswer(String(opt),q));
      grid.appendChild(btn);
    });
    wrap.appendChild(grid);

  } else if(type==="isian"){
    const div=document.createElement("div");
    div.className="isian-wrap";
    const hint=document.createElement("div");
    hint.className="isian-hint";hint.textContent="Ketik jawabanmu di bawah ini, lalu tekan Jawab!";
    const inp=document.createElement("input");
    inp.type="text";inp.inputMode="numeric";inp.pattern="[0-9]*";
    inp.className="isian-input";inp.placeholder="?";inp.id="isian-inp";
    inp.autocomplete="off";
    const sbmt=document.createElement("button");
    sbmt.className="isian-submit";sbmt.textContent="✓ Jawab";sbmt.id="isian-btn";
    sbmt.addEventListener("click",()=>{
      const val=inp.value.trim();
      if(!val){inp.focus();return;}
      inp.disabled=true;sbmt.disabled=true;
      submitAnswer(val,q);
    });
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")sbmt.click();});
    div.appendChild(hint);div.appendChild(inp);div.appendChild(sbmt);
    wrap.appendChild(div);
    setTimeout(()=>inp.focus(),150);

  } else if(type==="hitung"){
    const hint=document.createElement("div");
    hint.className="hitung-hint";
    hint.textContent="👆 Klik setiap "+q.emoji+" satu per satu untuk menghitung!";
    wrap.appendChild(hint);
    // scoreboard
    const sb=document.createElement("div");sb.className="hitung-scoreboard";
    const lbl=document.createElement("span");lbl.style.fontWeight="800";lbl.style.fontSize="0.9rem";lbl.textContent="Sudah dihitung:";
    const disp=document.createElement("div");disp.className="hitung-count-display";disp.id="hitung-disp";disp.textContent="0";
    const sbmt=document.createElement("button");
    sbmt.className="hitung-submit";sbmt.textContent="✓ Selesai!";sbmt.id="hitung-btn";sbmt.disabled=true;
    sb.appendChild(lbl);sb.appendChild(disp);sb.appendChild(sbmt);
    wrap.appendChild(sb);
    // canvas
    const canvas=document.createElement("div");canvas.className="hitung-canvas";
    let clickCount=0;
    const total=parseInt(q.count)||0;
    // Generate random-ish positions
    const cols=Math.ceil(Math.sqrt(total));
    for(let i=0;i<total;i++){
      const obj=document.createElement("div");
      obj.className="hitung-obj";
      obj.textContent=q.emoji;
      obj.dataset.idx=i;
      obj.addEventListener("click",function(){
        if(state.answered||this.classList.contains("clicked"))return;
        clickCount++;
        this.classList.add("clicked");
        const badge=document.createElement("span");
        badge.className="hitung-counter";badge.textContent=clickCount;
        this.appendChild(badge);
        document.getElementById("hitung-disp").textContent=clickCount;
        if(clickCount>=1)sbmt.disabled=false;
      });
      canvas.appendChild(obj);
    }
    wrap.appendChild(canvas);
    sbmt.addEventListener("click",()=>{
      if(state.answered)return;
      document.querySelectorAll(".hitung-obj").forEach(o=>o.classList.add("done"));
      sbmt.disabled=true;
      submitAnswer(String(clickCount),q);
    });

  } else if(type==="visual_pilgan"){
    // Visual display
    const vd=document.createElement("div");vd.className="visual-display";
    const total=parseInt(q.count)||0;
    let vis="";
    for(let i=0;i<total;i++)vis+=q.emoji+" ";
    vd.textContent=vis.trim();
    wrap.appendChild(vd);
    // Options: shuffle [correct, wrong1, wrong2, wrong3]
    const correct=String(q.answer);
    const opts=[...new Set([correct,...(q.options||[]).filter(o=>String(o)!==correct)])].slice(0,4);
    while(opts.length<4)opts.push(String(parseInt(correct)+(opts.length)));
    // Shuffle
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
    const grid=document.createElement("div");grid.className="options";
    opts.forEach(opt=>{
      const btn=document.createElement("button");
      btn.className="option";btn.textContent=opt;btn.dataset.val=opt;
      btn.style.fontSize="1.4rem";
      btn.addEventListener("click",()=>submitAnswer(String(opt),q));
      grid.appendChild(btn);
    });
    wrap.appendChild(grid);
  }
}

async function submitAnswer(userVal, q){
  if(state.answered)return;
  state.answered=true;
  const correct=String(userVal).trim().toLowerCase()===state.currentAnswer;
  const type=q.type||"pilgan";

  // Visual feedback on elements
  if(type==="pilgan"||type==="visual_pilgan"){
    document.querySelectorAll(".option").forEach(btn=>{
      btn.disabled=true;
      const v=String(btn.dataset.val).trim().toLowerCase();
      if(v===state.currentAnswer)btn.classList.add("correct");
      else if(v===String(userVal).trim().toLowerCase()&&!correct)btn.classList.add("wrong");
    });
  } else if(type==="isian"){
    const inp=document.getElementById("isian-inp");
    if(inp){inp.classList.add(correct?"correct":"wrong");}
  } else if(type==="hitung"){
    const disp=document.getElementById("hitung-disp");
    if(disp){disp.style.color=correct?"#388E3C":"#E64A19";}
  }

  try{
    let body={kc_id:state.currentKC};
    if(type==="isian"||type==="hitung"){
      body.user_answer=userVal;
      body.correct_answer=state.currentAnswer;
    } else {
      body.correct=correct;
    }
    const res=await api(`/api/answer/${state.sid}`,"POST",body);
    showFeedback(correct,res);
    if(res.mastered)showToast("🎊 Materi dikuasai!");
    if(res.progress)updateProgress(res.progress);
  }catch(e){console.error(e);}

  document.getElementById("btn-next").style.display="block";
}

function showFeedback(correct,res){
  const msgs=correct?CORRECT_MSG:WRONG_MSG;
  const[title,sub]=msgs[Math.floor(Math.random()*msgs.length)];
  let extra=(res&&res.stars_earned>0)?`<br><span class="star-anim" style="font-size:1rem;display:inline-block;margin-top:3px">+${res.stars_earned} ⭐</span>`:"";
  const fb=document.getElementById("feedback");
  document.getElementById("feedback-emoji").textContent=correct?"🌟":"💡";
  document.getElementById("feedback-text").innerHTML=`<strong>${title}</strong><br><span style="font-size:.85rem;font-weight:600">${sub}</span>${extra}`;
  fb.className="feedback show "+(correct?"good":"bad");
}
function updateProgress(prog){
  document.getElementById("prog-bar").style.width=(prog.pct||0)+"%";
  document.getElementById("prog-label").textContent=`${prog.mastered}/${prog.total} KC selesai`;
  ["q-stars","t-stars"].forEach(id=>document.getElementById(id).textContent=prog.stars||0);
}
function updatePlayerUI(){
  const av=AVATARS[state.avatar]||"🦊";
  ["t","q"].forEach(p=>{
    document.getElementById(p+"-av").textContent=av;
    document.getElementById(p+"-name").textContent=state.name;
  });
}
document.getElementById("btn-next").addEventListener("click",loadNextQuestion);
document.getElementById("btn-again").addEventListener("click",()=>{
  state={sid:null,name:"",avatar:1,topic:null,currentKC:null,currentAnswer:null,currentType:null,answered:false};
  document.getElementById("inp-name").value="";
  show("register");
});
</script>
